<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llabench — Benchmark Database</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 20px; }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    min-width: 140px;
  }
  .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 1.25rem; font-weight: 600; color: var(--accent); }

  /* Filters */
  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  .filter-group { display: flex; flex-direction: column; }
  .filter-group input, .filter-group select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.875rem;
    min-width: 120px;
  }
  .filter-group input:focus, .filter-group select:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.7rem;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  th:hover { color: var(--text); }
  th .sort-arrow { margin-left: 4px; opacity: 0.3; }
  th.sorted-asc .sort-arrow, th.sorted-desc .sort-arrow { opacity: 1; color: var(--accent); }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:hover td { background: rgba(88,166,255,0.04); }
  .tps { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tps-high { color: var(--green); }
  .tps-mid { color: var(--yellow); }
  .tps-low { color: var(--red); }
  .tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
  }
  .tag-own { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
  .tag-external { background: rgba(88,166,255,0.15); color: var(--accent); border: 1px solid rgba(88,166,255,0.3); }
  .device-name { font-weight: 600; white-space: nowrap; }
  .model-name { max-width: 250px; word-break: break-word; }
  .quant-tag { color: var(--yellow); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Detail modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .modal .detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 0.85rem; }
  .modal .detail-label { color: var(--text-muted); min-width: 140px; flex-shrink: 0; }
  .modal .detail-value { word-break: break-word; }
  .modal .close-btn {
    float: right;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
  }
  .modal .close-btn:hover { color: var(--text); }

  /* Empty state */
  .empty { text-align: center; padding: 40px; color: var(--text-muted); }

  /* Responsive */
  @media (max-width: 768px) {
    .filters { flex-direction: column; }
    .filter-group input, .filter-group select { min-width: 100%; }
  }
</style>
</head>
<body>

<h1 style="margin-bottom:20px">llabench — LLM Benchmark Database</h1>

<div class="stats" id="stats"></div>

<div class="filters">
  <div class="filter-group">
    <label>Search</label>
    <input type="text" id="search" placeholder="model, quant, notes...">
  </div>
  <div class="filter-group">
    <label>Model</label>
    <select id="filter-model"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Device</label>
    <select id="filter-device"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Engine</label>
    <select id="filter-engine"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Quant</label>
    <select id="filter-quant"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>MTP</label>
    <select id="filter-mtp">
      <option value="">All</option>
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Source</label>
    <select id="filter-source"><option value="">All</option></select>
  </div>
</div>

<div class="table-wrap">
  <table id="bench-table">
    <thead>
      <tr>
        <th data-col="id" onclick="sortTable('id')">ID <span class="sort-arrow">↕</span></th>
        <th data-col="date" onclick="sortTable('date')">Date <span class="sort-arrow">↕</span></th>
        <th data-col="device.name" onclick="sortTable('device.name')" style="max-width:200px">Device <span class="sort-arrow">↕</span></th>
        <th data-col="model.name" onclick="sortTable('model.name')" style="max-width:300px">Model <span class="sort-arrow">↕</span></th>
        <th data-col="engine.name" onclick="sortTable('engine.name')">Engine <span class="sort-arrow">↕</span></th>
        <th data-col="model.quant" onclick="sortTable('model.quant')">Quant <span class="sort-arrow">↕</span></th>
        <th data-col="test.context_size" onclick="sortTable('test.context_size')">Context <span class="sort-arrow">↕</span></th>
        <th data-col="test.token_generation_speed_tps" onclick="sortTable('test.token_generation_speed_tps')" style="text-align:right">tok/s <span class="sort-arrow">↕</span></th>
        <th data-col="source" onclick="sortTable('source')">Source <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="bench-body"></tbody>
  </table>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let benchmarks = [];
let sortCol = 'test.token_generation_speed_tps';
let sortDir = -1; // -1 = desc, 1 = asc

function normalizeModel(name) {
  // Strip org prefix and parenthetical notes first
  let cleaned = name.replace(/^[^/]*\//, '').replace(/\s*\(.*?\)/g, '');
  // Qwen family: base = Qwen<major>.<minor>-<params><arch> (arch like A3B may have trailing letter)
  const qwen = cleaned.match(/^(Qwen[\d.]+-\d+[A-Z]+(?:-[A-Z]\d+[A-Z]?)?)/);
  if (qwen) return qwen[1];
  // Nemotron family: base = Nemotron-<ver>-<params><arch>
  const nemotron = cleaned.match(/^(Nemotron-[\d.]+-\d+[A-Z]\d+)/);
  if (nemotron) return nemotron[1];
  // Fallback: return as-is
  return cleaned;
}

function normalizeQuant(q) {
  if (!q) return '';
  const map = {
    'NVFP4 Experts-Only': 'NVFP4',
    'NVFP4': 'NVFP4',
    'INT4': 'INT4',
    'Q8_0': 'Q8_0',
    'FP8': 'FP8',
    'BF16': 'BF16',
  };
  return map[q] || q;
}

async function init() {
  const sources = ['data/benchmarks.json', 'data/hardware.json'];
  benchmarks = [];
  let hardwareMap = {};

  for (const src of sources) {
    try {
      const res = await fetch(src);
      const data = await res.json();
      if (src.includes('hardware')) {
        // Build hardware lookup map
        if (Array.isArray(data)) {
          data.forEach(h => { hardwareMap[h.id] = h; });
        } else {
          hardwareMap[data.id] = data;
        }
      } else {
        // Handle both single object and array
        if (Array.isArray(data)) {
          benchmarks.push(...data);
        } else {
          benchmarks.push(data);
        }
      }
    } catch(e) {
      console.warn(`Skipped ${src}:`, e.message);
    }
  }

  // Resolve hardware_id → device object
  benchmarks.forEach(b => {
    if (b.hardware_id && hardwareMap[b.hardware_id]) {
      b.device = hardwareMap[b.hardware_id];
    }
    b._normModel = normalizeModel(b.model.name || '');
    b._normQuant = normalizeQuant(b.model.quant || '');
  });

  if (benchmarks.length === 0) {
    document.getElementById('bench-body').innerHTML = '<tr><td colspan="8" class="empty">No benchmark data found.</td></tr>';
    return;
  }

  populateFilters();
  updateStats();

  // Restore saved filter state
  const saved = localStorage.getItem('llabench-filters');
  if (saved) {
    try {
      const state = JSON.parse(saved);
      Object.keys(state).forEach(id => {
        const el = document.getElementById(id);
        if (el && state[id]) el.value = state[id];
      });
      // Restore sort state
      if (state.sortCol) sortCol = state.sortCol;
      if (state.sortDir) sortDir = parseInt(state.sortDir);
    } catch(e) {}
  }

  // Restore sort header styling
  if (sortCol) {
    const activeTh = document.querySelector(`th[data-col="${sortCol}"]`);
    if (activeTh) {
      activeTh.classList.add(sortDir === -1 ? 'sorted-desc' : 'sorted-asc');
      const arrow = activeTh.querySelector('.sort-arrow');
      if (arrow) arrow.textContent = sortDir === -1 ? '↓' : '↑';
    }
  }

  renderTable();

  // Event listeners
  document.getElementById('search').addEventListener('input', renderTable);
  ['filter-model', 'filter-device', 'filter-engine', 'filter-quant', 'filter-mtp', 'filter-source'].forEach(id => {
    document.getElementById(id).addEventListener('change', renderTable);
  });

  // Save filters + sort on any change
  function saveState() {
    const state = { sortCol, sortDir };
    ['search', 'filter-model', 'filter-device', 'filter-engine', 'filter-quant', 'filter-mtp', 'filter-source'].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.value) state[id] = el.value;
    });
    localStorage.setItem('llabench-filters', JSON.stringify(state));
  }
  document.querySelectorAll('.filters input, .filters select').forEach(el => {
    el.addEventListener('input', saveState);
    el.addEventListener('change', saveState);
  });

  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });
}

function populateFilters() {
  const models = [...new Set(benchmarks.map(b => b._normModel))].sort();
  const devices = [...new Set(benchmarks.map(b => b.device.name))].sort();
  const engines = [...new Set(benchmarks.map(b => b.engine.name))].sort();
  const quants = [...new Set(benchmarks.map(b => b._normQuant).filter(Boolean))].sort();
  const sources = [...new Set(benchmarks.map(b => b.source))].sort();

  ['filter-model', 'filter-device', 'filter-engine', 'filter-quant', 'filter-source'].forEach(id => {
    const sel = document.getElementById(id);
    const map = {
      'filter-model': models,
      'filter-device': devices,
      'filter-engine': engines,
      'filter-quant': quants,
      'filter-source': sources
    };
    map[id].forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
  });
}

function updateStats() {
  const total = benchmarks.length;
  const devices = new Set(benchmarks.map(b => b.device.name)).size;
  const engines = new Set(benchmarks.map(b => b.engine.name)).size;
  const own = benchmarks.filter(b => b.source === 'own-run').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">Total Benchmarks</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">Devices</div><div class="value">${devices}</div></div>
    <div class="stat-card"><div class="label">Engines</div><div class="value">${engines}</div></div>
    <div class="stat-card"><div class="label">Own Runs</div><div class="value">${own}</div></div>
  `;
}

function getFiltered() {
  const search = document.getElementById('search').value.toLowerCase();
  const model = document.getElementById('filter-model').value;
  const device = document.getElementById('filter-device').value;
  const engine = document.getElementById('filter-engine').value;
  const quant = document.getElementById('filter-quant').value;
  const mtp = document.getElementById('filter-mtp').value;
  const source = document.getElementById('filter-source').value;

  return benchmarks.filter(b => {
    if (model && b._normModel !== model) return false;
    if (device && b.device.name !== device) return false;
    if (engine && b.engine.name !== engine) return false;
    if (quant && b._normQuant !== quant) return false;
    if (mtp && String(b.model.mtp) !== mtp) return false;
    if (source && b.source !== source) return false;
    if (search) {
      const haystack = [b.id, b.model.name, b.model.quant, b.engine.fork || '', b.test.note || '', b.notes || ''].join(' ').toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

function sortTable(col) {
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = -1;
  }

  // Update header styling
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = '↕';
  });
  const activeTh = document.querySelector(`th[data-col="${col}"]`);
  if (activeTh) {
    activeTh.classList.add(sortDir === -1 ? 'sorted-desc' : 'sorted-asc');
    const arrow = activeTh.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = sortDir === -1 ? '↓' : '↑';
  }

  renderTable();
  saveState();
}

function getNested(obj, path) {
  return path.split('.').reduce((o, k) => o && o[k], obj);
}

function formatTps(val) {
  if (val == null) return '—';
  const cls = val >= 80 ? 'tps-high' : val >= 40 ? 'tps-mid' : 'tps-low';
  return `<span class="tps ${cls}">${val.toFixed(1)}</span>`;
}

function formatContext(val) {
  if (val == null) return '—';
  if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
  if (val >= 1000) return (val / 1000).toFixed(0) + 'K';
  return val;
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('bench-body');

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No benchmarks match your filters.</td></tr>';
    return;
  }

  // Sort
  filtered.sort((a, b) => {
    const aVal = getNested(a, sortCol);
    const bVal = getNested(b, sortCol);
    if (sortCol === 'test.token_generation_speed_tps') {
      return ((aVal || 0) - (bVal || 0)) * sortDir;
    }
    if (typeof aVal === 'number' && typeof bVal === 'number') {
      return (aVal - bVal) * sortDir;
    }
    return String(aVal || '').localeCompare(String(bVal || '')) * sortDir;
  });

  tbody.innerHTML = filtered.map(b => `
    <tr onclick="showDetail('${b.id}')" style="cursor:pointer">
      <td><code>${b.id}</code></td>
      <td>${b.date}</td>
      <td class="device-name">${b.device.name}</td>
      <td class="model-name" title="${b.model.name}">${b.model.name.length > 50 ? b.model.name.substring(0, 50) + '…' : b.model.name}</td>
      <td>${b.engine.name}${b.engine.fork ? '<br><small style="color:var(--text-muted)">' + b.engine.fork.split('/')[1] + '</small>' : ''}</td>
      <td><span class="quant-tag">${b.model.quant || '—'}</span></td>
      <td>${formatContext(b.test.context_size)}</td>
      <td style="text-align:right">${formatTps(b.test.token_generation_speed_tps)}</td>
      <td><span class="tag tag-${b.source === 'own-run' ? 'own' : 'external'}">${b.source}</span></td>
    </tr>
  `).join('');
}

function showDetail(id) {
  const b = benchmarks.find(x => x.id === id);
  if (!b) return;

  const mtpTag = b.model.mtp ? '<span class="tag tag-own">MTP</span>' : '';
  const forkLink = b.engine.fork_url ? `<a href="${b.engine.fork_url}" target="_blank">${b.engine.fork}</a>` : (b.engine.fork || '—');
  const sourceLink = b.source_url ? `<a href="${b.source_url}" target="_blank">source</a>` : '—';

  document.getElementById('modal-content').innerHTML = `
    <h2>${b.id} ${mtpTag}</h2>

    <div class="detail-row"><div class="detail-label">Date</div><div class="detail-value">${b.date}</div></div>
    <div class="detail-row"><div class="detail-label">Source</div><div class="detail-value">${sourceLink} (${b.source})</div></div>

    <hr style="border-color:var(--border);margin:12px 0">

    <div class="detail-row"><div class="detail-label">Device</div><div class="detail-value"><strong>${b.device.name}</strong><br>${b.device.gpu} · ${b.device.compute_cap} · ${b.device.memory_bandwidth}${b.device.unified_memory ? ' · ' + b.device.unified_memory + ' unified' : ''}</div></div>

    <hr style="border-color:var(--border);margin:12px 0">

    <div class="detail-row"><div class="detail-label">Engine</div><div class="detail-value"><strong>${b.engine.name}</strong> ${b.engine.version ? '(' + b.engine.version + ')' : ''} · ${forkLink}</div></div>
    ${Object.keys(b.engine.config).length ? '<div class="detail-row"><div class="detail-label">Config</div><div class="detail-value"><code>' + JSON.stringify(b.engine.config, null, 2) + '</code></div></div>' : ''}

    <hr style="border-color:var(--border);margin:12px 0">

    <div class="detail-row"><div class="detail-label">Model</div><div class="detail-value model-name"><strong>${b.model.name}</strong></div></div>
    <div class="detail-row"><div class="detail-label">Quant</div><div class="detail-value">${b.model.quant || '—'} · ${b.model.total_params ? (b.model.total_params / 1e9).toFixed(1) + 'B total / ' + (b.model.active_params / 1e9).toFixed(1) + 'B active' : ''}</div></div>

    <hr style="border-color:var(--border);margin:12px 0">

    <div class="detail-row"><div class="detail-label">Context</div><div class="detail-value">${formatContext(b.test.context_size)}</div></div>
    <div class="detail-row"><div class="detail-label">Concurrency</div><div class="detail-value">${b.test.concurrency || 1}</div></div>
    <div class="detail-row"><div class="detail-label">Prompt TPS</div><div class="detail-value">${b.test.prompt_processing_speed_tps ? b.test.prompt_processing_speed_tps.toFixed(1) : '—'}</div></div>
    <div class="detail-row"><div class="detail-label">Gen TPS</div><div class="detail-value" style="font-size:1.1rem;font-weight:700">${formatTps(b.test.token_generation_speed_tps)}</div></div>
    ${b.test.avg_completion_tokens ? '<div class="detail-row"><div class="detail-label">Avg Tokens</div><div class="detail-value">' + b.test.avg_completion_tokens + '</div></div>' : ''}
    ${b.test.rounds ? '<div class="detail-row"><div class="detail-label">Rounds</div><div class="detail-value">' + b.test.rounds + '</div></div>' : ''}
    ${b.test.note ? '<div class="detail-row"><div class="detail-label">Note</div><div class="detail-value">' + b.test.note + '</div></div>' : ''}

    ${b.notes ? '<hr style="border-color:var(--border);margin:12px 0"><div class="detail-row"><div class="detail-label">Notes</div><div class="detail-value">' + b.notes + '</div></div>' : ''}
  `;

  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

init();
</script>
</body>
</html>
